<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <title>For Kavya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div class="grain" aria-hidden="true"></div>
        <p class="eyebrow">A small note for</p>
        <h1 id="intro-title">Hi Kavya.</h1>
        <p class="intro-hint">Keep going <span aria-hidden="true">↓</span></p>
      </section>

      <section class="celebration" aria-labelledby="celebration-title">
        <div class="topline" aria-hidden="true"><span></span><span>2026</span></div>
        <div class="photo photo-one"><img src="public/photos/IMG_5213.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-two"><img src="public/photos/IMG_4745.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-three"><img src="public/photos/IMG_4483.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-four"><img src="public/photos/IMG_4114.png" alt="A favorite moment with Kavya" /></div>
        <div class="message">
          <p class="eyebrow">The plot twist</p>
          <h2 id="celebration-title">Congrats<br />on graduating<span>!!</span></h2>
          <div class="party" aria-label="celebration">🥳</div>
          <p class="signoff">You did it, Kavya.</p>
        </div>
        <div class="bottomline" aria-hidden="true"><span>Class of 2026</span><span>With love</span></div>
      </section>
    </main>
    <button class="save-button" type="button" onclick="window.print()" aria-label="Save this graduation card as a printable page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0-11 4 4m-4-4L8 7M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg>
      Save as a card
    </button>
    <script src="script.js"></script>
  </body>
</html>
