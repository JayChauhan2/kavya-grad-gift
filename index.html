<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <title>For Kavya</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div class="grain" aria-hidden="true"></div>
        <h1 id="intro-title">Hi Kavya,</h1>
        <div class="opening-artwork" aria-hidden="true">
          <img class="opening-art" src="public/opening-graduation-crew.png" alt="" />
          <span class="hat-orbit"><img src="public/hat.png" alt="" /></span>
        </div>
        <button class="intro-hint" type="button" aria-label="Reveal the surprise"><img src="public/eyes.png" alt="" /></button>
      </section>

      <section class="celebration" aria-labelledby="celebration-title">
        <div class="photo photo-one"><img src="public/photos/IMG_5213.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-two"><img src="public/photos/IMG_4745.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-three"><img src="public/photos/IMG_4483.png" alt="A favorite moment with Kavya" /></div>
        <div class="photo photo-four"><img src="public/photos/IMG_4114.png" alt="A favorite moment with Kavya" /></div>
        <div class="message">
          <h2 id="celebration-title">CONGRATS<br /><span class="graduating">ON GRADUATING <img class="exclamation" src="public/double-exclamation-mark.png" alt="!!" /> <b class="party" aria-label="celebration">🥳</b></span></h2>
        </div>
      </section>
      <section class="letter-reveal" aria-labelledby="reveal-copy">
        <div class="reveal-copy-wrap">
          <p id="reveal-copy">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
        </div>
      </section>
    </main>
    <button class="save-button" type="button" onclick="window.print()" aria-label="Save this graduation card as a printable page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0-11 4 4m-4-4L8 7M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg>
      Save as a card
    </button>
    <script src="script.js"></script>
  </body>
</html>
